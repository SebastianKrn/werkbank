[[check]]
id = "homelab-fremdes-geraet"
type = "datei_zeilen_min"
stufe = "homelab"
path = "abgabe/homelab.txt"
min = 2
hint_de = "Nur mit eigenem Labor: Hol das Backup auf einem anderen Gerät zurück, prüfe dort den Hash und schreibe 2 Zeilen in abgabe\\homelab.txt."
