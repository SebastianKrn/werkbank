# Woran erkennst du, dass das eine virtuelle Maschine ist? Ein Satz.
vm_indiz = ""

# Wissensfrage, für alle gleich: Welcher Partitionsstil gehört zu UEFI?
passt_zu_uefi = ""

# Bonus: Warum steht bei MediaType in einer VM oft "Unspecified"?
medientyp_erklaerung = ""
