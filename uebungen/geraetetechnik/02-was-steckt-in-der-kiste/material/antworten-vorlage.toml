# Vorlage für deine Antworten — Übung 02
#
#   Copy-Item "uebungen\02-was-steckt-in-der-kiste\material\antworten-vorlage.toml" "$a\antworten.toml"
#
# Zeilen mit # sind Notizen und werden nicht geprüft.
#
# So schreibst du eine Antwort:
#
#     schluessel = 'deine antwort'
#
# Nimm EINFACHE Anführungszeichen. Dann darf in der Antwort alles vorkommen —
# auch Pfade und Befehle mit Backslash, zum Beispiel 'C:\wb\firma'.
# (In doppelten Anführungszeichen wäre \ ein Sonderzeichen und die ganze
# Datei wäre kaputt.)

# Deine Inventur — die Werte deiner eigenen Maschine.
# Diese Antworten prüft wb nur auf Vollständigkeit; gelesen werden sie im Unterricht.

# Wie viele Kerne hat der Prozessor? (hardware.txt: NumberOfCores)
kerne = ''

# Wie viel Arbeitsspeicher in GB? (hardware.txt: TotalPhysicalMemory, geteilt durch 1GB)
ram_gb = ''

# Uefi oder Bios? (firmware.txt: BiosFirmwareType)
firmware_typ = ''

# GPT oder MBR? (firmware.txt oder datentraeger.txt: PartitionStyle)
partitionsstil = ''

# Woran erkennst du, dass das eine virtuelle Maschine ist? Ein Satz.
vm_indiz = ''

# Wissensfrage, für alle gleich: Welcher Partitionsstil gehört zu UEFI?
passt_zu_uefi = ''

# Bonus: Warum steht bei MediaType in einer VM oft "Unspecified"?
medientyp_erklaerung = ''
