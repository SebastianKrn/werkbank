[package]
name = "wb"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Werkbank practice runner: declarative exercise checks with German learner feedback"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SebastianKrn/werkbank"
publish = false

[[bin]]
name = "wb"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
# Single portable binary: small, no debug info, no unwinding machinery.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
