name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  runner:
    name: runner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is the platform that matters (SPEC §8); ubuntu keeps
        # the development machine honest.
        os: [windows-latest, ubuntu-latest]

    defaults:
      run:
        working-directory: runner

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('runner/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --bins

      - name: Integration tests
        run: cargo test --test cli

      # Content is code: every exercise.toml must validate.
      # M2 adds the real module here: `cargo run -- intern lint ../uebungen`
      - name: Content lint
        run: cargo run --quiet -- intern lint tests/fixtures/modul-demo/uebungen
