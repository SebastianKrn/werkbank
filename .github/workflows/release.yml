name: Release

# Builds the pilot ZIP from a tag and publishes it as a GitHub Release (SPEC §5).
#
# This is the only path that produces a classroom-ready ZIP, because it is the
# only place where a Windows binary exists: the development machine is Linux and
# cannot cross-compile wb.exe (ADR 0006).
#
#   git tag v0.1.0-rc1 && git push origin v0.1.0-rc1
#
# Exactly two tag shapes are accepted: `vX.Y.Z` (full release) and `vX.Y.Z-rcN`
# (pre-release, lowercase rc, N >= 1). Anything else fails the guard.
# workflow_dispatch runs everything except publishing — use it to test the
# pipeline itself.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MODUL: geraetetechnik

# Least privilege by default; the publishing job widens this for itself.
permissions:
  contents: read

jobs:
  # A wb that reports a different version than the ZIP it ships in costs a
  # debugging hour on exactly the day nobody has one.
  guard:
    name: version guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # The one rule for what a release tag looks like. Both answers this
          # job produces — the version and the pre-release flag — come out of
          # these two patterns, so the guard and the badge on the release page
          # can never disagree.
          #
          # A glob would be too loose: `v[0-9]*.[0-9]*.[0-9]*` also matches
          # `v0.1.0-RC2` and `v0.1.0-foo`, which then get published as a FULL
          # release — no pre-release badge, no "Testversion" banner.
          fassung='^v[0-9]+\.[0-9]+\.[0-9]+$'
          vorab='^v[0-9]+\.[0-9]+\.[0-9]+-rc[1-9][0-9]*$'

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              version="v0.0.0-dispatch"
              # Never published (the release job runs on tag pushes only), but
              # if it ever were, it would be a pre-release.
              prerelease=true
              echo "Dry run — no tag, no version guard, nothing published."
          else
              version="${GITHUB_REF#refs/tags/}"
              # The tag name reaches shell commands in later jobs, and git ref
              # names may legally contain `$`, backticks, `;` and `|`. These two
              # patterns admit nothing but digits, dots, `v` and `rc`, so a tag
              # can never carry a payload either.
              if [[ "$version" =~ $fassung ]]; then
                  prerelease=false
              elif [[ "$version" =~ $vorab ]]; then
                  prerelease=true
              else
                  echo "Tag ${version} is not a release tag." >&2
                  echo "Allowed: vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rcN" >&2
                  echo "         (lowercase rc, N starting at 1 — v0.1.0, v0.1.0-rc2)." >&2
                  echo "Delete the tag, fix the name, push again." >&2
                  exit 1
              fi
              crate="$(grep -m1 '^version' runner/Cargo.toml | cut -d'"' -f2)"
              # v0.1.0-rc1 -> 0.1.0, so a release candidate may share the
              # crate version of the release it is a candidate for.
              tag_version="${version#v}"
              tag_version="${tag_version%%-*}"
              if [ "$tag_version" != "$crate" ]; then
                  echo "Tag ${version} does not match runner/Cargo.toml version ${crate}." >&2
                  echo "Bump the crate version or fix the tag — they must agree." >&2
                  exit 1
              fi
              echo "Tag ${version} matches crate version ${crate}."
          fi

          if [ "$prerelease" = "true" ]; then
              echo "${version} is a pre-release: it gets the Testversion banner."
          else
              echo "${version} is a full release."
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

  # ci.yml runs on branches and pull requests, which a tag push does not touch.
  # Without this job a tag on an unmerged commit would ship a classroom ZIP that
  # never ran a single test.
  test:
    name: test before shipping
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Formatting
        run: cargo fmt --check

      # --locked in every cargo call that resolves dependencies: what gets
      # tested here and what gets built into the two binaries below must come
      # from runner/Cargo.lock, not from whatever cargo would resolve today.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets

      - name: Lint the shipped content
        run: cargo run --locked --quiet -- intern lint ../uebungen

  build:
    name: build (${{ matrix.os }})
    needs: [guard, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            binary: wb.exe
            artifact: wb-windows
          - os: ubuntu-latest
            binary: wb
            artifact: wb-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build release binary
        working-directory: runner
        # Same lockfile as the test job above, so both ZIP binaries come from
        # the dependency set that was actually tested.
        run: cargo build --locked --release

      # The Windows binary is the one a learner double-clicks, and until here
      # nothing had ever run it: the package job verifies the ZIP by running the
      # LINUX binary. So run the freshly built wb.exe against this repo's own
      # uebungen/ before it is allowed into an artifact. `--wurzel` points it at
      # a Werkbank folder without unpacking a ZIP first.
      - name: Smoke test the Windows binary
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          wb="runner/target/release/wb.exe"
          "$wb" --version
          "$wb" hilfe
          "$wb" status --wurzel .
          "$wb" intern lint uebungen
          echo "wb.exe starts, finds the module and validates the content."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: runner/target/release/${{ matrix.binary }}
          if-no-files-found: error

  package:
    name: package and verify
    needs: [guard, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wb-linux
          path: eingang/linux

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wb-windows
          path: eingang/windows

      - name: Build the learner ZIP
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          # Artifact upload does not preserve the executable bit.
          chmod +x eingang/linux/wb
          scripts/paket.sh "$MODUL" "$VERSION" \
              --wb-linux eingang/linux/wb \
              --wb-windows eingang/windows/wb.exe

      # Verify the artifact that will actually be handed out, not the tree it
      # was built from. This is the last automated gate before a human carries
      # this ZIP into a classroom.
      - name: Verify the published artifact
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          zip="dist/werkbank-${MODUL}-${VERSION}.zip"

          pruef="$(mktemp -d)"
          unzip -q "$zip" -d "$pruef"
          cd "$pruef/werkbank-${MODUL}"

          test -f wb.exe || { echo "wb.exe missing from the ZIP." >&2; exit 1; }
          echo "wb.exe present: $(stat -c%s wb.exe) bytes"

          # Parsing rather than grepping also proves --json emits valid JSON.
          uebungen="$(./wb status --json |
              python3 -c 'import json,sys; print(len(json.load(sys.stdin)["uebungen"]))')"
          if [ "$uebungen" -ne 8 ]; then
              echo "Expected 8 exercises in the packaged module, found ${uebungen}." >&2
              exit 1
          fi
          echo "Unpacked ZIP runs and reports 8 exercises."

          ./wb intern lint uebungen

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pilot-zip
          path: |
            dist/werkbank-${{ env.MODUL }}-${{ needs.guard.outputs.version }}.zip
            dist/MANIFEST.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: publish release
    needs: [guard, package]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pilot-zip
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Quoted delimiter: the body is German prose full of backticks and
          # Windows backslashes, and none of it should meet the shell.
          if [ "$PRERELEASE" = "true" ]; then
              cat > hinweise.md <<'VORAB'
          **Testversion.** Noch nicht für den Unterricht — erst nach dem
          Testprotokoll (docs/TESTPROTOKOLL.md).

          VORAB
          else
              : > hinweise.md
          fi

          cat >> hinweise.md <<'EOF'
          ## Für Lernende

          ZIP herunterladen, nach `C:\` entpacken, dann in der PowerShell:

          ```powershell
          cd C:\werkbank-geraetetechnik
          .\wb status
          ```

          Alles Weitere steht in `START_HIER.md` im ZIP.

          Warnt Windows vor unbekannter Herkunft? Das ist normal — die Datei ist
          nicht signiert. In `START_HIER.md` steht unter „Wenn etwas nicht geht“,
          wie du weiterkommst.

          ## Inhalt

          Acht Übungen Gerätetechnik, der Runner `wb.exe` (Windows) und `wb` (Linux).
          Kein Installer, kein Internet nötig, keine Daten verlassen deinen Rechner.

          Prüfsummen in `SHA256SUMS.txt`, Dateiliste in `MANIFEST.txt`.
          EOF

          args=(--title "Werkbank Gerätetechnik ${VERSION}" --notes-file hinweise.md)
          # Same variable as the banner above: the badge on the release page and
          # the "Testversion" note in the body cannot drift apart.
          if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
          fi

          gh release create "$VERSION" "${args[@]}" \
              "dist/werkbank-${MODUL}-${VERSION}.zip" \
              dist/SHA256SUMS.txt \
              dist/MANIFEST.txt
